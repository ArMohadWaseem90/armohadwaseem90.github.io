<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinos Creation</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040906;
  --panel:#0b1a11;
  --edge:#1c4a2e;
  --leaf:#2fdc7a;
  --moss:#7bb98f;
  --ink:#e6f5ea;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.6}

/* ---------- Title card ---------- */
.hero{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:32px 20px;text-align:center;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 38%,rgba(47,220,122,.22),transparent 55%),
    repeating-linear-gradient(135deg,rgba(47,220,122,.05) 0 2px,transparent 2px 26px),
    var(--bg);
}
.dino{font-size:clamp(90px,28vw,170px);line-height:1;transform:scaleX(-1);
  filter:drop-shadow(0 0 26px rgba(47,220,122,.7)) hue-rotate(-20deg) saturate(1.4);
  animation:rise 1.1s ease-out both}
@keyframes rise{from{opacity:0;transform:scaleX(-1) translateY(40px)}}
.welcome{font-size:clamp(14px,4vw,20px);color:var(--moss);letter-spacing:.12em}
h1{font-family:"Bungee",system-ui,sans-serif;font-weight:400;font-size:clamp(38px,12vw,92px);
  line-height:1.05;color:var(--leaf);text-shadow:0 0 28px rgba(47,220,122,.55),4px 4px 0 #04200f}
.tag{max-width:30em;color:var(--moss);font-size:18px}
.go{display:inline-block;margin-top:8px;padding:14px 30px;border:2px solid var(--leaf);
  color:var(--leaf);text-decoration:none;font-weight:700;border-radius:4px;transition:.2s}
.go:hover,.go:focus-visible{background:var(--leaf);color:var(--bg);outline:none}

/* ---------- Projects ---------- */
.projects{max-width:980px;margin:0 auto;padding:72px 20px 40px}
