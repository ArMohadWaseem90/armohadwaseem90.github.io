<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinos Creation</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040906;
  --panel:#0b1a11;
  --edge:#1c4a2e;
  --leaf:#2fdc7a;
  --moss:#7bb98f;
  --ink:#e6f5ea;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.6}

/* ---------- Title card ---------- */
.hero{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;padding:32px 20px;text-align:center;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 36%,rgba(47,220,122,.28),transparent 58%),
    repeating-linear-gradient(135deg,rgba(47,220,122,.05) 0 2px,transparent 2px 26px),
    var(--bg);
}
.dino{
  width:min(300px,72vw);height:auto;display:block;
  /* fades the bottom edge of the image into the dark background */
  -webkit-mask-image:linear-gradient(to bottom,#000 68%,transparent 100%);
          mask-image:linear-gradient(to bottom,#000 68%,transparent 100%);
  filter:drop-shadow(0 0 22px rgba(47,220,122,.55)) saturate(.9) brightness(.92);
  animation:rise 1.1s ease-out both;
}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}
.welcome{font-size:clamp(14px,4vw,20px);color:var(--moss);letter-spacing:.12em;margin-top:-24px}
h1{font-family:"Bungee",system-ui,sans-serif;font-weight:400;font-size:clamp(38px,12vw,92px);
  line-height:1.05;color:var(--leaf);text-shadow:0 0 28px rgba(47,220,122,.55),4px 4px 0 #04200f}
.tag{max-width:30em;color:var(--moss);font-size:18px}
.go{display:inline-block;margin-top:8px;padding:14px 30px;border:2px solid var(--leaf);
  color:var(--leaf);text-decoration:none;font-weight:700;border-radius:4px;transition:.2s}
.go:hover,.go:focus-visible{background:var(--leaf);color:var(--bg);outline:none}

/* ---------- Projects ---------- */
.projects{max-width:980px;margin:0 auto;padding:72px 20px 40px}
.projects h2{font-family:"Bungee",system-ui,sans-serif;font-weight:400;font-size:clamp(26px,7vw,40px);
  color:var(--leaf);margin-bottom:6px}
.projects>p{color:var(--moss);margin-bottom:32px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--panel);border:1px solid var(--edge);border-left:5px solid var(--leaf);
  padding:20px;display:flex;flex-direction:column;gap:10px;border-radius:4px}
.card h3{font-size:20px;color:var(--ink)}
.card p{color:var(--moss);flex:1}
.card a{color:var(--leaf);font-weight:700;text-decoration:none}
.card a:hover{text-decoration:underline}
.empty{border:2px dashed var(--edge);padding:28px;color:var(--moss);text-align:center}

footer{text-align:center;color:var(--moss);padding:36px 20px 48px;border-top:1px solid var(--edge);margin-top:40px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}}
</style>
</head>
<body>

<header class="hero">
  <img class="dino" src="dino.png" alt="Green cartoon dinosaur">
  <p class="welcome">Welcome to</p>
  <h1>Dinos<br>Creation</h1>
  <p class="tag">All my projects in one place.</p>
  <a class="go" href="#projects">View projects</a>
</header>

<main class="projects" id="projects">
  <h2>Projects</h2>
  <p>My latest creations</p>
  <div class="grid" id="grid"></div>
</main>

<footer>© Dinos Creation</footer>

<script>
/* To add a project, add one more line to the list below.
   title = name, text = short description, link = project link (use "" if none) */
const projects = [
  { title: "First Project", text: "Write about your project here.", link: "" },
  { title: "Second Project", text: "Replace this text with your own.", link: "" }
];

const grid = document.getElementById("grid");
if (projects.length === 0) {
  grid.innerHTML = '<div class="empty">Projects coming soon.</div>';
} else {
  projects.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    const h = document.createElement("h3"); h.textContent = p.title;
    const t = document.createElement("p"); t.textContent = p.text;
    card.append(h, t);
    if (p.link) {
      const a = document.createElement("a");
      a.href = p.link; a.textContent = "Open"; a.target = "_blank"; a.rel = "noopener";
      card.append(a);
    }
    grid.append(card);
  });
}
</script>
</body>
</html>
